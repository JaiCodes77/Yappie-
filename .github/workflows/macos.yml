name: macOS

# Runs the shared dictionary contract against the Swift implementation, and the
# activity ledger (words / streak / heatmap) which is also platform-neutral.
# The Windows workflow runs the identical dictionary vectors against the C# one.

on:
  push:
    branches: [main]
    paths: ['Sources/**', 'Tests/**', 'shared/**', 'Package.swift', '.github/workflows/macos.yml']
  pull_request:
    paths: ['Sources/**', 'Tests/**', 'shared/**', 'Package.swift', '.github/workflows/macos.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Dictionary and activity
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Package.swift declares swift-tools-version 6.2, but the runner defaults to an
      # older Xcode (Swift 6.1) and fails to even parse the manifest. Select the newest
      # Xcode present rather than pinning a version that will age out of the image.
      - name: Select the newest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $latest"
          sudo xcode-select -s "$latest/Contents/Developer"

      - name: Swift version
        run: swift --version

      # The app target needs macOS 26 and the Speech framework, which the runner image
      # does not have. The dictionary target is deliberately platform-neutral, so it — and
      # the contract that matters here — builds and tests anywhere.
      - name: Test the dictionary and activity targets
        run: swift test --filter 'VectorTests|ActivityTests'

      - name: Confirm the vectors on both sides are identical
        run: |
          if ! diff -q shared/dictionary-test-vectors.json Tests/YappieDictionaryTests/dictionary-test-vectors.json; then
            echo "::error::The Swift test copy of the vectors has drifted from shared/."
            echo "Run: cp shared/dictionary-test-vectors.json Tests/YappieDictionaryTests/"
            exit 1
          fi
          echo "Vectors match."
